[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nxceviri"
version = "0.56.0"
description = "NXTR — Switch oyun metinlerini Türkçeye çevirme ve LayeredFS mod üretme aracı"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6-Essentials>=6.9,<7",
    "cryptography>=44",
    "zstandard>=0.23",
    "UnityPy>=1.25,<2",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "fonttools>=4.50,<5",
    "lz4>=4.3,<5",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.gui-scripts]
nxceviri = "nxceviri.gui.app:main"

[tool.setuptools.packages.find]
include = ["nxceviri*"]

[tool.setuptools.package-data]
nxceviri = ["assets/fonts/*", "assets/spell/*", "assets/dmc1/*", "gui/icons/*", "gui/appicon/*", "gui/help/*"]  # OFL yazı tipleri (lisansları yanlarında) ve DMC1 düşman açıklamaları

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "N", "C4", "PIE", "PT", "RET", "TID"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # karmaşıklık/sihirli sayı: ikili formatlarda doğal
    "S101",     # testlerde assert
    "RUF001", "RUF002", "RUF003",  # Türkçe karakterler bilerek kullanılıyor
    "S324",     # hashlib kullanımı güvenlik amaçlı değil
    "N818",     # OperationCancelled bir hata değil, bilinçli bir durum
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415", "N802", "PLR0917"]  # test üreticileri biçimin alan sırasını yansıtır
"nxceviri/gui/**" = ["N802", "N815"]  # Qt yöntem adları (dragEnterEvent vb.)

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["nxceviri", "tests"]
# pytest-qt'nin QtBot yöntemleri (keyClick, mouseClick…) tip ipucu taşımaz; yalnızca onlar muaf tutulur.
untyped_calls_exclude = ["pytestqt.qtbot"]

[[tool.mypy.overrides]]
module = ["zstandard.*", "fontTools.*", "lz4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gui: PySide6 arayüz testleri",
]
qt_api = "pyside6"
